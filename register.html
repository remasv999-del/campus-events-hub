<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for a campus event">
  <title>Campus Events Hub | Register</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="register">
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html">Campus Events Hub</a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a class="active" href="register.html">Register</a>
        <a href="registrations.html">Registrations</a>
        <a href="about.html">About & Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="eyebrow">Student Registration</p>
        <h1>Register for an Event</h1>
        <p>Complete the form below. All fields are required.</p>
      </div>
    </section>

    <section class="section">
      <div class="container narrow">
        <form id="registration-form" class="form-card" novalidate>
          <div id="registration-message" class="form-message" role="status" aria-live="polite"></div>

          <div class="form-group">
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" type="text" autocomplete="name" required>
            <small class="error-message" data-error-for="fullName"></small>
          </div>

          <div class="form-group">
            <label for="student-id">Student ID</label>
            <input id="student-id" name="studentId" type="text" inputmode="numeric" placeholder="Example: 123456789" required>
            <small class="error-message" data-error-for="studentId"></small>
          </div>

          <div class="form-group">
            <label for="student-email">University email</label>
            <input id="student-email" name="email" type="email" autocomplete="email" placeholder="student@seu.edu.sa" required>
            <small class="error-message" data-error-for="email"></small>
          </div>

          <div class="form-group">
            <label for="selected-event">Selected event</label>
            <select id="selected-event" name="eventId" required>
              <option value="">Choose an event</option>
            </select>
            <small class="error-message" data-error-for="eventId"></small>
          </div>

          <div class="form-group checkbox-group">
            <input id="agreement" name="agreement" type="checkbox" required>
            <label for="agreement">I confirm that the information is correct.</label>
          </div>
          <small class="error-message" data-error-for="agreement"></small>

          <button class="button primary full-width" type="submit">Submit Registration</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; <span class="current-year"></span> Campus Events Hub.</p>
      <p>Developed for the IT361 Web Programming Project.</p>
    </div>
  </footer>
</body>
</html>
